<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" class="w-full h-full" style="max-height: 180px;">
  <defs>
    <!-- Gradient for WEG Blue Metallic Cast Iron -->
    <linearGradient id="wegBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="45%" stop-color="#1d4ed8" />
      <stop offset="85%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Finned Casing Ribs Gradient -->
    <linearGradient id="ribGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Stainless Steel Shaft Gradient -->
    <linearGradient id="shaftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Fan Cowl Charcoal Gradient -->
    <linearGradient id="cowlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Terminal Box Gradient -->
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
  </defs>

  <!-- Ground Drop Shadow -->
  <ellipse cx="200" cy="245" rx="150" ry="18" fill="rgba(0,0,0,0.6)" filter="blur(6px)" />

  <!-- ==================== MOUNTING BASE (PATAS DE FIJACIÓN) ==================== -->
  <path d="M90 215 L260 215 L270 238 L80 238 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <!-- Mounting bolts -->
  <ellipse cx="105" cy="228" rx="6" ry="3" fill="#64748b" stroke="#94a3b8" />
  <ellipse cx="245" cy="228" rx="6" ry="3" fill="#64748b" stroke="#94a3b8" />

  <!-- ==================== REAR FAN COWL (CUBIERTA DE VENTILADOR) ==================== -->
  <path d="M70 110 C70 75 95 65 110 65 L125 65 L125 210 L110 210 C95 210 70 200 70 165 Z" fill="url(#cowlGrad)" stroke="#1e293b" stroke-width="1.5" />
  <!-- Ventilation Slots in Fan Cowl -->
  <line x1="82" y1="95" x2="82" y2="180" stroke="#090d16" stroke-width="3" stroke-linecap="round" />
  <line x1="90" y1="85" x2="90" y2="190" stroke="#090d16" stroke-width="3" stroke-linecap="round" />
  <line x1="98" y1="80" x2="98" y2="195" stroke="#090d16" stroke-width="3" stroke-linecap="round" />
  <line x1="106" y1="75" x2="106" y2="200" stroke="#090d16" stroke-width="3" stroke-linecap="round" />
  <line x1="114" y1="72" x2="114" y2="203" stroke="#090d16" stroke-width="3" stroke-linecap="round" />

  <!-- ==================== MAIN STATOR CASING (CARCASA ALEADA) ==================== -->
  <rect x="125" y="70" width="125" height="138" rx="6" fill="url(#wegBlueGrad)" stroke="#1e40af" stroke-width="1.5" />

  <!-- Longitudinal Stator Cooling Fins (Aletas de Refrigeración) -->
  <rect x="127" y="76" width="121" height="5" fill="url(#ribGrad)" rx="1" />
  <rect x="127" y="86" width="121" height="5" fill="url(#ribGrad)" rx="1" />
  <rect x="127" y="96" width="121" height="5" fill="url(#ribGrad)" rx="1" />
  <rect x="127" y="106" width="121" height="5" fill="url(#ribGrad)" rx="1" />
  <rect x="127" y="116" width="121" height="5" fill="url(#ribGrad)" rx="1" />
  <rect x="127" y="126" width="121" height="5" fill="url(#ribGrad)" rx="1" />
  <rect x="127" y="136" width="121" height="5" fill="url(#ribGrad)" rx="1" />
  <rect x="127" y="146" width="121" height="5" fill="url(#ribGrad)" rx="1" />
  <rect x="127" y="156" width="121" height="5" fill="url(#ribGrad)" rx="1" />
  <rect x="127" y="166" width="121" height="5" fill="url(#ribGrad)" rx="1" />
  <rect x="127" y="176" width="121" height="5" fill="url(#ribGrad)" rx="1" />
  <rect x="127" y="186" width="121" height="5" fill="url(#ribGrad)" rx="1" />
  <rect x="127" y="196" width="121" height="5" fill="url(#ribGrad)" rx="1" />

  <!-- WEG Stamped Metal Nameplate -->
  <rect x="150" y="130" width="75" height="24" rx="2" fill="#0f172a" stroke="#60a5fa" stroke-width="0.8" />
  <text x="187" y="142" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold" fill="#60a5fa" text-anchor="middle">WEG · W01</text>
  <text x="187" y="150" font-family="'JetBrains Mono', monospace" font-size="5.5" fill="#94a3b8" text-anchor="middle">0.5 HP · 115V · 60Hz</text>

  <!-- ==================== TERMINAL BOX (CAJA DE BORNES EN CIMA) ==================== -->
  <polygon points="155,42 225,42 215,70 145,70" fill="url(#termGrad)" stroke="#60a5fa" stroke-width="1.2" />
  <polygon points="145,70 215,70 215,75 145,75" fill="#1e3a8a" />
  <!-- Cable gland exit -->
  <ellipse cx="222" cy="54" rx="4" ry="7" fill="#0f172a" stroke="#94a3b8" stroke-width="1" />

  <!-- ==================== FRONT ENDBELL & BEARING SHIELD ==================== -->
  <path d="M250 72 C275 72 290 98 290 139 C290 180 275 206 250 206 Z" fill="url(#wegBlueGrad)" stroke="#1e40af" stroke-width="1.5" />
  <!-- Bearing Hub -->
  <ellipse cx="282" cy="139" rx="14" ry="32" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <ellipse cx="287" cy="139" rx="8" ry="18" fill="#334155" stroke="#64748b" />

  <!-- ==================== ROTATING DRIVE SHAFT (EJE DE SALIDA) ==================== -->
  <!-- Main cylindrical shaft -->
  <path d="M292 131 L355 131 L355 147 L292 147 Z" fill="url(#shaftGrad)" stroke="#475569" stroke-width="1" />
  <!-- Shaft end chamfer -->
  <ellipse cx="355" cy="139" rx="4" ry="8" fill="#e2e8f0" stroke="#94a3b8" />
  <!-- Keyway slot (Chavetero) -->
  <rect x="308" y="133" width="30" height="3" fill="#1e293b" rx="1" />

  <!-- Dynamic Rotating Crosshair / Runner (Driven by CSS class .motor-running-active) -->
  <g class="shaft-spinner" transform="translate(355, 139)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4, 3" opacity="0.8" />
    <circle cx="0" cy="0" r="2.5" fill="#38bdf8" />
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#38bdf8" stroke-width="1.2" />
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#38bdf8" stroke-width="1.2" />
  </g>

  <!-- Rotation arrows (Visual cue) -->
  <g opacity="0.65" transform="translate(372, 115)">
    <path d="M0 0 A 16 16 0 0 1 12 24" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="2, 2" />
    <polygon points="12,24 16,19 9,20" fill="#22d3ee" />
  </g>
</svg>
